{% extends 'principal.html' %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Eliminar Reparación</h4>
        </div>
        <div class="card-body">
            <p>¿Estás seguro de que deseas borrar este registro de reparación para <strong>"{{ object.maquina }}"</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'reparacion_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Eliminar registro</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
